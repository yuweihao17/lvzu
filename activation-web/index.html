<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吕祖灵签激活中心</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f6fb;
        color: #20242d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 18px 14px 42px;
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-bottom: 12px;
      }

      .topbar button {
        width: auto;
        min-width: 104px;
        height: 38px;
        margin: 0;
        padding: 0 14px;
        border: 1px solid #d8dce6;
        background: #fff;
        color: #3478f6;
        font-size: 14px;
      }

      .card {
        margin-top: 14px;
        padding: 24px 20px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 28px rgba(31, 43, 69, 0.1);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: #edf3ff;
        color: #3478f6;
        font-size: 34px;
        line-height: 72px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        text-align: center;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 21px;
      }

      h3 {
        margin: 22px 0 10px;
        font-size: 17px;
      }

      .steps {
        margin: 10px 0 22px;
        color: #8c93a3;
        font-size: 15px;
        text-align: center;
      }

      label {
        display: block;
        margin: 16px 0 8px;
        font-weight: 600;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 0 14px;
        border: 1px solid #d8dce6;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
      }

      input,
      select {
        height: 48px;
      }

      textarea {
        min-height: 128px;
        padding-top: 12px;
        line-height: 22px;
        resize: vertical;
      }

      button,
      .buy-link {
        width: 100%;
        height: 50px;
        border-radius: 8px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
      }

      button {
        margin-top: 18px;
        border: 0;
        background: #3478f6;
        color: #fff;
      }

      button.secondary {
        border: 1px solid #d8dce6;
        background: #fff;
        color: #3478f6;
      }

      button.danger {
        background: #d34836;
      }

      .buy-link {
        display: block;
        margin: 18px 0 6px;
        border: 1px solid #3478f6;
        color: #3478f6;
        line-height: 48px;
        text-align: center;
        text-decoration: none;
      }

      .buy-tip,
      .hint {
        color: #727887;
        font-size: 14px;
        line-height: 22px;
      }

      .buy-tip {
        text-align: center;
      }

      .hint {
        margin-top: 18px;
      }

      .result {
        margin-top: 20px;
        padding: 18px;
        border-radius: 10px;
        background: #f1f6ff;
        text-align: center;
      }

      .code {
        margin-top: 8px;
        color: #172033;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 4px;
      }

      .msg {
        min-height: 22px;
        margin-top: 14px;
        color: #d34836;
        line-height: 22px;
        text-align: center;
      }

      .ok {
        color: #1f8f4d;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .admin-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .output {
        margin-top: 12px;
      }

      .record {
        margin-top: 12px;
        padding: 14px;
        border: 1px solid #e5e8f0;
        border-radius: 10px;
        background: #fbfcff;
      }

      .record-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: 700;
      }

      .record-title button {
        width: auto;
        height: 34px;
        margin: 0;
        padding: 0 12px;
        font-size: 13px;
      }

      .kv {
        margin-top: 8px;
        color: #535b6d;
        font-size: 14px;
        line-height: 22px;
        word-break: break-all;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 560px) {
        .wrap {
          padding-top: 12px;
        }

        .card {
          padding: 22px 16px;
        }

        .grid,
        .admin-actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="topbar">
        <button id="showActivate" class="secondary" type="button">激活中心</button>
        <button id="showAdmin" class="secondary" type="button">管理员登录</button>
      </div>

      <section class="card" id="activatePanel">
        <div class="icon">钥</div>
        <h1 id="pageTitle">激活中心</h1>
        <div class="steps">购买卡密 -> 输入设备码 -> 生成 / 找回激活码</div>

        <label for="productSelect">产品</label>
        <select id="productSelect"></select>

        <a class="buy-link" id="buyLink" href="https://www.ifdian.net/item/3f67aea8590111f1bb3652540025c377" target="_blank" rel="noopener">前往爱发电购买</a>
        <div class="buy-tip">购买后回到本页，输入卡密和设备码生成或找回激活码</div>

        <label for="cardCode">卡密</label>
        <input id="cardCode" autocomplete="off" placeholder="输入购买后收到的卡密" />

        <label for="deviceCode">设备码</label>
        <input id="deviceCode" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="输入手环显示的 8 位设备码" />

        <button id="submit" type="button">生成 / 找回激活码</button>
        <div class="msg" id="message"></div>

        <div class="result" id="result" hidden>
          <div>请在手环输入以下激活码</div>
          <div class="code" id="activationCode"></div>
        </div>

        <div class="hint">卡密只绑定一台设备。已激活用户输入同一卡密和同一设备码，可在本页找回激活码。</div>
      </section>

      <section class="card hidden" id="adminPanel">
        <h2>管理员中心</h2>
        <div class="hint">这里用于批量生成卡密、导入卡密、查询激活记录和解绑重置。管理员密码是云函数 config.js 里的 adminSecret。</div>

        <div id="adminLogin">
          <label for="adminSecret">管理员密码</label>
          <input id="adminSecret" type="password" autocomplete="current-password" placeholder="输入 adminSecret" />
          <button id="adminLoginBtn" type="button">进入管理</button>
        </div>

        <div id="adminTools" class="hidden">
          <div class="admin-actions">
            <button id="adminLogout" class="secondary" type="button">退出登录</button>
            <button id="copyGenerated" class="secondary" type="button">复制生成结果</button>
          </div>

          <h3>批量生成卡密</h3>
          <label for="adminProductSelect">产品</label>
          <select id="adminProductSelect"></select>
          <div class="grid">
            <div>
              <label for="cardCount">生成数量</label>
              <input id="cardCount" type="number" min="1" max="500" value="20" />
            </div>
            <div>
              <label for="cardPrefix">卡密前缀</label>
              <input id="cardPrefix" maxlength="8" value="LZ" />
            </div>
          </div>
          <button id="generateCards" type="button">生成并写入数据库</button>
          <textarea id="generatedOutput" class="output" readonly placeholder="生成的卡密会显示在这里，可复制到爱发电自动随机回复"></textarea>

          <h3>导入已有卡密</h3>
          <textarea id="importInput" placeholder="一行一个卡密，适合从外部表格复制进来"></textarea>
          <button id="importCards" type="button">导入数据库</button>

          <h3>查询与解绑</h3>
          <label for="searchKeyword">卡密 / 设备码 / 订单号 / 激活码</label>
          <input id="searchKeyword" autocomplete="off" placeholder="输入要查询的内容" />
          <button id="searchBtn" type="button">查询</button>
          <div class="msg" id="adminMessage"></div>
          <div id="searchResults"></div>
        </div>
      </section>
    </main>

    <script>
      const API_BASE = "/api"
      const ADMIN_KEY = "lvzu_admin_secret"
      const DEFAULT_PRODUCT_ID = "lvzu_lingqian"
      const PRODUCTS = {
        lvzu_lingqian: {
          id: "lvzu_lingqian",
          name: "吕祖灵签",
          prefix: "LZ",
          buyUrl: "https://www.ifdian.net/item/3f67aea8590111f1bb3652540025c377"
        }
      }

      const params = new URLSearchParams(location.search)
      const pageTitle = document.getElementById("pageTitle")
      const productSelect = document.getElementById("productSelect")
      const adminProductSelect = document.getElementById("adminProductSelect")
      const buyLink = document.getElementById("buyLink")
      const deviceInput = document.getElementById("deviceCode")
      const cardInput = document.getElementById("cardCode")
      const message = document.getElementById("message")
      const result = document.getElementById("result")
      const activationCode = document.getElementById("activationCode")
      const activatePanel = document.getElementById("activatePanel")
      const adminPanel = document.getElementById("adminPanel")
      const adminLogin = document.getElementById("adminLogin")
      const adminTools = document.getElementById("adminTools")
      const adminSecretInput = document.getElementById("adminSecret")
      const adminMessage = document.getElementById("adminMessage")
      const searchResults = document.getElementById("searchResults")
      const generatedOutput = document.getElementById("generatedOutput")

      function normalizeProductId(value) {
        return String(value || DEFAULT_PRODUCT_ID).replace(/[^a-zA-Z0-9_-]/g, "") || DEFAULT_PRODUCT_ID
      }

      function getProduct(id) {
        return PRODUCTS[normalizeProductId(id)] || PRODUCTS[DEFAULT_PRODUCT_ID]
      }

      function fillProductSelect(select, selected) {
        select.innerHTML = Object.keys(PRODUCTS).map(id => {
          const product = PRODUCTS[id]
          return "<option value=\"" + id + "\">" + product.name + "</option>"
        }).join("")
        select.value = getProduct(selected).id
      }

      function applyProduct(productId) {
        const product = getProduct(productId)
        productSelect.value = product.id
        adminProductSelect.value = product.id
        pageTitle.textContent = product.name + "激活中心"
        buyLink.href = product.buyUrl
        document.getElementById("cardPrefix").value = product.prefix || ""
      }

      fillProductSelect(productSelect, params.get("product"))
      fillProductSelect(adminProductSelect, params.get("product"))
      applyProduct(params.get("product"))
      deviceInput.value = (params.get("device") || "").replace(/[^0-9]/g, "").slice(0, 8)
      adminSecretInput.value = localStorage.getItem(ADMIN_KEY) || ""
      setAdminState(false)

      function unwrapResponse(data) {
        if (data && typeof data.body === "string") {
          try {
            return JSON.parse(data.body)
          } catch (err) {
            return data
          }
        }
        return data
      }

      async function api(path, body, admin) {
        const payload = body || {}
        if (admin) payload.adminSecret = adminSecretInput.value
        const res = await fetch(API_BASE + path, {
          method: "POST",
          headers: { "content-type": "text/plain;charset=UTF-8" },
          body: JSON.stringify(payload)
        })
        const text = await res.text()
        let parsed = null
        try {
          parsed = text ? JSON.parse(text) : null
        } catch (err) {
          parsed = null
        }
        const data = unwrapResponse(parsed || text)
        if (admin && data && data.ok === false && data.message === "管理员密码错误") {
          setAdminState(false)
          localStorage.removeItem(ADMIN_KEY)
          adminSecretInput.value = ""
        }
        if (!res.ok && (!data || typeof data !== "object")) {
          throw new Error("HTTP " + res.status + ": " + text.slice(0, 200))
        }
        return data
      }

      function showPanel(name) {
        activatePanel.classList.toggle("hidden", name !== "activate")
        adminPanel.classList.toggle("hidden", name !== "admin")
      }

      function setAdminState(loggedIn) {
        adminLogin.classList.toggle("hidden", loggedIn)
        adminTools.classList.toggle("hidden", !loggedIn)
      }

      function setAdminMessage(text, ok) {
        adminMessage.textContent = text || ""
        adminMessage.classList.toggle("ok", Boolean(ok))
      }

      function formatTime(value) {
        if (!value) return "-"
        const date = new Date(value)
        if (Number.isNaN(date.getTime())) return String(value)
        return date.toLocaleString()
      }

      function row(label, value) {
        return "<div class=\"kv\"><b>" + label + "：</b>" + (value || "-") + "</div>"
      }

      function recordHtml(type, item) {
        const cardCode = item.card_code || "-"
        const canReset = item.card_code ? "<button class=\"danger\" data-reset=\"" + item.card_code + "\" type=\"button\">解绑重置</button>" : ""
        return "<div class=\"record\">" +
          "<div class=\"record-title\"><span>" + type + "：" + cardCode + "</span>" + canReset + "</div>" +
          row("产品", item.product_id || DEFAULT_PRODUCT_ID) +
          row("状态", item.status) +
          row("设备码", item.bound_device_code || item.device_code) +
          row("激活码", item.activation_code) +
          row("订单号", item.order_no) +
          row("创建时间", formatTime(item.created_at)) +
          row("激活时间", formatTime(item.activated_at)) +
          "</div>"
      }

      function renderResults(data) {
        const results = data.results || {}
        const cards = results.cards || []
        const orders = results.orders || []
        const activations = results.activations || []
        const total = cards.length + orders.length + activations.length
        if (!total) {
          searchResults.innerHTML = "<div class=\"hint\">没有找到记录</div>"
          return
        }
        searchResults.innerHTML =
          cards.map(item => recordHtml("卡密", item)).join("") +
          orders.map(item => recordHtml("订单", item)).join("") +
          activations.map(item => recordHtml("激活记录", item)).join("")
      }

      document.getElementById("showActivate").addEventListener("click", () => showPanel("activate"))
      productSelect.addEventListener("change", () => applyProduct(productSelect.value))
      adminProductSelect.addEventListener("change", () => applyProduct(adminProductSelect.value))
      document.getElementById("showAdmin").addEventListener("click", () => {
        showPanel("admin")
        setAdminState(false)
        setAdminMessage("")
        adminSecretInput.value = localStorage.getItem(ADMIN_KEY) || ""
      })

      document.getElementById("submit").addEventListener("click", async () => {
        message.textContent = ""
        message.classList.remove("ok")
        result.hidden = true

        const cardCode = cardInput.value.trim()
        const deviceCode = deviceInput.value.replace(/[^0-9]/g, "").slice(0, 8)
        if (!cardCode) {
          message.textContent = "请输入卡密"
          return
        }
        if (deviceCode.length !== 8) {
          message.textContent = "请输入 8 位设备码"
          return
        }

        try {
          const data = await api("/activate", { productId: productSelect.value, cardCode, deviceCode })
          if (!data.ok) {
            message.textContent = data.message || "激活失败"
            return
          }
          activationCode.textContent = data.activationCode
          message.textContent = data.message || "激活码生成成功"
          message.classList.add("ok")
          result.hidden = false
        } catch (err) {
          message.textContent = "网络异常，请稍后重试"
        }
      })

      document.getElementById("adminLoginBtn").addEventListener("click", async () => {
        const secret = adminSecretInput.value.trim()
        if (!secret) {
          setAdminMessage("请输入管理员密码")
          return
        }
        adminSecretInput.value = secret
        try {
          const data = await api("/admin/ping", {}, true)
          if (!data.ok) {
            localStorage.removeItem(ADMIN_KEY)
            setAdminState(false)
            setAdminMessage(data.message || "管理员密码错误")
            return
          }
          localStorage.setItem(ADMIN_KEY, secret)
          setAdminState(true)
          setAdminMessage("已进入管理员中心", true)
        } catch (err) {
          setAdminMessage("网络异常，无法验证管理员密码")
        }
      })

      document.getElementById("adminLogout").addEventListener("click", () => {
        localStorage.removeItem(ADMIN_KEY)
        adminSecretInput.value = ""
        setAdminState(false)
        setAdminMessage("")
      })

      document.getElementById("generateCards").addEventListener("click", async () => {
        setAdminMessage("")
        try {
          const data = await api("/admin/generate-cards", {
            productId: adminProductSelect.value,
            count: document.getElementById("cardCount").value,
            prefix: document.getElementById("cardPrefix").value
          }, true)
          if (!data.ok) {
            setAdminMessage(data.message || "生成失败")
            return
          }
          generatedOutput.value = data.text || (data.cards || []).join("\n")
          setAdminMessage("已生成 " + (data.cards || []).length + " 个卡密", true)
        } catch (err) {
          setAdminMessage("网络异常，生成失败")
        }
      })

      document.getElementById("copyGenerated").addEventListener("click", async () => {
        if (!generatedOutput.value) {
          setAdminMessage("没有可复制的卡密")
          return
        }
        try {
          await navigator.clipboard.writeText(generatedOutput.value)
          setAdminMessage("已复制生成结果", true)
        } catch (err) {
          generatedOutput.select()
          setAdminMessage("浏览器不允许自动复制，请手动复制文本框内容")
        }
      })

      document.getElementById("importCards").addEventListener("click", async () => {
        setAdminMessage("")
        const cards = document.getElementById("importInput").value.split(/\s+/).filter(Boolean)
        if (!cards.length) {
          setAdminMessage("请输入要导入的卡密")
          return
        }
        try {
          const data = await api("/admin/import-cards", { productId: adminProductSelect.value, cards }, true)
          if (!data.ok) {
            setAdminMessage(data.message || "导入失败")
            return
          }
          setAdminMessage("成功导入 " + data.created + " 个新卡密，重复卡密已跳过", true)
        } catch (err) {
          setAdminMessage("网络异常，导入失败")
        }
      })

      document.getElementById("searchBtn").addEventListener("click", async () => {
        setAdminMessage("")
        searchResults.innerHTML = ""
        const keyword = document.getElementById("searchKeyword").value.trim()
        if (!keyword) {
          setAdminMessage("请输入查询内容")
          return
        }
        try {
          const data = await api("/admin/search", { productId: adminProductSelect.value, keyword }, true)
          if (!data.ok) {
            setAdminMessage(data.message || "查询失败")
            return
          }
          renderResults(data)
        } catch (err) {
          setAdminMessage("网络异常，查询失败")
        }
      })

      searchResults.addEventListener("click", async event => {
        const cardCode = event.target.getAttribute("data-reset")
        if (!cardCode) return
        if (!confirm("确定解绑并重置卡密 " + cardCode + " 吗？")) return
        try {
          const data = await api("/admin/reset-card", { productId: adminProductSelect.value, cardCode }, true)
          if (!data.ok) {
            setAdminMessage(data.message || "重置失败")
            return
          }
          setAdminMessage("已重置 " + cardCode, true)
          document.getElementById("searchBtn").click()
        } catch (err) {
          setAdminMessage("网络异常，重置失败")
        }
      })
    </script>
  </body>
</html>
