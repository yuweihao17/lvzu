services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xiaomi_app_store
      POSTGRES_USER: xiaomi_app_store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - xiaomi_app_store_postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaomi_app_store -d xiaomi_app_store"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3100
      DATABASE_URL: postgresql://xiaomi_app_store:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/xiaomi_app_store
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET in .env}
      ACTIVATION_SALT: ${ACTIVATION_SALT:?set ACTIVATION_SALT in .env}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  xiaomi_app_store_postgres:
