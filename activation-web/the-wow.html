<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>the_wow 激活中心</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #eef2f8;
        color: #172033;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      .wrap {
        width: min(960px, 100%);
        margin: 0 auto;
        padding: 28px 16px 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .brand {
        font-size: 26px;
        font-weight: 800;
      }

      .topbar a {
        color: #2563eb;
        font-size: 14px;
        text-decoration: none;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 16px;
      }

      .card {
        padding: 22px;
        border: 1px solid #dce3ef;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 28px rgba(23, 32, 51, 0.08);
      }

      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.2;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 18px;
      }

      h3 {
        margin-top: 18px;
        font-size: 15px;
      }

      .hint {
        margin-top: 10px;
        color: #657086;
        font-size: 14px;
        line-height: 1.6;
      }

      label {
        display: block;
        margin: 16px 0 8px;
        color: #344055;
        font-size: 14px;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #cfd8e8;
        border-radius: 6px;
        background: #fff;
        color: #172033;
        font: inherit;
      }

      textarea {
        min-height: 180px;
        resize: vertical;
      }

      button {
        width: 100%;
        min-height: 44px;
        margin-top: 14px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }

      button.secondary {
        border: 1px solid #cfd8e8;
        background: #fff;
        color: #2563eb;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .result {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid #c7d2fe;
        border-radius: 8px;
        background: #eef2ff;
      }

      .activation-code {
        margin-top: 8px;
        color: #111827;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 2px;
        word-break: break-all;
      }

      .msg {
        min-height: 22px;
        margin-top: 12px;
        color: #c2410c;
        font-size: 14px;
        line-height: 1.5;
      }

      .ok {
        color: #15803d;
      }

      .entitlement {
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid #e4e9f2;
        border-radius: 6px;
        background: #fbfcff;
        color: #475569;
        font-size: 14px;
        line-height: 1.5;
      }

      .ledger {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid #e4e9f2;
        border-radius: 6px;
        background: #fbfcff;
      }

      .ledger-title {
        color: #172033;
        font-size: 14px;
        font-weight: 800;
      }

      .ledger-row {
        margin-top: 8px;
        color: #475569;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-all;
      }

      .section-box {
        margin-top: 18px;
        padding: 14px;
        border: 1px solid #e4e9f2;
        border-radius: 8px;
        background: #f8fbff;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .section-head .hint {
        margin-top: 0;
      }

      .mini-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .mini-actions button {
        width: auto;
        min-width: 120px;
        margin-top: 0;
      }

      .list {
        margin-top: 12px;
        display: grid;
        gap: 10px;
      }

      .list-item {
        padding: 12px;
        border: 1px solid #dbe4f1;
        border-radius: 8px;
        background: #fff;
      }

      .list-item-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.off {
        background: #fef3c7;
        color: #92400e;
      }

      .item-meta {
        margin-top: 6px;
        color: #6b7280;
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 760px) {
        .layout,
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="topbar">
        <div class="brand">the_wow</div>
        <a href="/index.html">吕祖灵签激活中心</a>
      </div>

      <div class="layout">
        <section class="card">
          <h1>卡密激活与查询</h1>
          <div class="hint">用户只需要记住卡密。购买后输入平台发送的新卡密；联系管理员升级时，告知原卡密后重启 APP 即可生效。</div>

          <label for="cardCode">卡密</label>
          <input id="cardCode" autocomplete="off" placeholder="输入平台自动发送的卡密" />

          <div class="grid">
            <button id="redeemBtn" type="button">激活/重新激活</button>
            <button id="statusBtn" class="secondary" type="button">查询卡密</button>
          </div>

          <div id="userMessage" class="msg"></div>
          <div id="userResult" class="result" hidden>
            <div>当前卡密</div>
            <div id="activationCode" class="activation-code"></div>
            <div id="licenseSummary" class="hint"></div>
            <div id="entitlements"></div>
          </div>
        </section>

        <section class="card">
          <h2>管理员生成卡密</h2>
          <div class="hint">生成后复制到淘宝、拼多多、闲鱼的自动发货卡密池。</div>

          <label for="adminSecret">管理员密码</label>
          <input id="adminSecret" type="password" autocomplete="current-password" placeholder="Vercel ADMIN_SECRET" />

          <label for="skuSelect">SKU</label>
          <select id="skuSelect"></select>

          <div class="grid">
            <div>
              <label for="cardCount">数量</label>
              <input id="cardCount" type="number" min="1" max="500" value="20" />
            </div>
            <div>
              <label for="cardPrefix">前缀</label>
              <input id="cardPrefix" maxlength="8" value="WOW" />
            </div>
          </div>

          <button id="generateBtn" type="button">生成并写入数据库</button>
          <button id="copyBtn" class="secondary" type="button">复制生成结果</button>
          <div id="adminMessage" class="msg"></div>
          <textarea id="generatedOutput" readonly placeholder="生成结果"></textarea>

          <h3>查询用户旧卡密</h3>
          <div class="hint">用户二次购买或微信付款升级时，让用户发第一次激活用的卡密，在这里查询当前权益。</div>

          <label for="adminSearchCode">用户原卡密 / 激活码</label>
          <input id="adminSearchCode" autocomplete="off" placeholder="用户告知的旧卡密" />

          <button id="adminSearchBtn" class="secondary" type="button">查询用户权益</button>
          <div id="adminSearchMessage" class="msg"></div>
          <div id="adminSearchResult" class="result" hidden></div>

          <h3>按已有卡密升级/加次数</h3>
          <div class="hint">用于微信收款后的人工升级。输入用户原卡密和要叠加的 SKU，用户重启 APP 后自动生效。</div>

          <label for="upgradeCardCode">用户原卡密</label>
          <input id="upgradeCardCode" autocomplete="off" placeholder="用户告知的旧卡密" />

          <label for="upgradeSkuSelect">升级 SKU</label>
          <select id="upgradeSkuSelect"></select>

          <button id="upgradeBtn" type="button">升级/加次数</button>
          <div id="upgradeMessage" class="msg"></div>
        </section>
      </div>

      <section class="card" style="margin-top: 16px;">
        <div class="section-head">
          <div>
            <h2>免费大模型管理</h2>
            <div class="hint">网页端维护免费模型目录，客户端只读取目录与代理地址，不直接接触平台侧 key。</div>
          </div>
          <div class="mini-actions">
            <button id="freeModelReloadBtn" class="secondary" type="button">刷新目录</button>
          </div>
        </div>

        <form id="freeModelForm" class="section-box">
          <div class="grid">
            <div>
              <label for="freeModelId">模型 ID</label>
              <input id="freeModelId" placeholder="agnes-2.0-flash" />
            </div>
            <div>
              <label for="freeModelName">显示名称</label>
              <input id="freeModelName" placeholder="Agnes-2.0-Flash" />
            </div>
          </div>

          <label for="freeModelDescription">说明</label>
          <input id="freeModelDescription" placeholder="免费文本/多模态模型说明" />

          <div class="grid">
            <div>
              <label for="freeModelProvider">Provider</label>
              <input id="freeModelProvider" placeholder="openai-compatible" />
            </div>
            <div>
              <label for="freeModelBaseUrl">上游地址</label>
              <input id="freeModelBaseUrl" placeholder="https://provider.example/v1" />
            </div>
          </div>

          <label for="freeModelApiKey">API Key</label>
          <input id="freeModelApiKey" type="password" placeholder="仅保存到网页端，不下发给客户端" />

          <div class="grid">
            <div>
              <label for="freeModelPriority">优先级</label>
              <input id="freeModelPriority" type="number" value="0" />
            </div>
            <div>
              <label for="freeModelSupportsMultimodal">能力</label>
              <select id="freeModelSupportsMultimodal">
                <option value="false">文本模型</option>
                <option value="true">多模态模型</option>
              </select>
            </div>
          </div>

          <div class="grid">
            <div>
              <label for="freeModelEnabled">状态</label>
              <select id="freeModelEnabled">
                <option value="true">启用</option>
                <option value="false">停用</option>
              </select>
            </div>
            <div>
              <label for="freeModelStream">输出方式</label>
              <select id="freeModelStream">
                <option value="true">流式</option>
                <option value="false">非流式</option>
              </select>
            </div>
          </div>

          <div class="mini-actions">
            <button id="freeModelSaveBtn" type="submit">保存模型</button>
            <button id="freeModelClearBtn" class="secondary" type="button">清空表单</button>
          </div>
          <div id="freeModelMessage" class="msg"></div>
        </form>

        <div id="freeModelList" class="list"></div>
      </section>
    </main>

    <script>
      const API_BASE = "/api"
      const TIERS = [
        ["standard", "标准版"],
        ["ultra", "Ultra 版"],
        ["max", "Max 版"]
      ]

      const skuSelect = document.getElementById("skuSelect")
      const adminSecret = document.getElementById("adminSecret")
      const userMessage = document.getElementById("userMessage")
      const adminMessage = document.getElementById("adminMessage")
      const userResult = document.getElementById("userResult")
      const activationCode = document.getElementById("activationCode")
      const licenseSummary = document.getElementById("licenseSummary")
      const entitlements = document.getElementById("entitlements")
      const generatedOutput = document.getElementById("generatedOutput")
      const upgradeMessage = document.getElementById("upgradeMessage")
      const upgradeSkuSelect = document.getElementById("upgradeSkuSelect")
      const adminSearchMessage = document.getElementById("adminSearchMessage")
      const adminSearchResult = document.getElementById("adminSearchResult")
      const freeModelMessage = document.getElementById("freeModelMessage")
      const freeModelList = document.getElementById("freeModelList")
      const freeModelForm = document.getElementById("freeModelForm")
      const freeModelId = document.getElementById("freeModelId")
      const freeModelName = document.getElementById("freeModelName")
      const freeModelDescription = document.getElementById("freeModelDescription")
      const freeModelProvider = document.getElementById("freeModelProvider")
      const freeModelBaseUrl = document.getElementById("freeModelBaseUrl")
      const freeModelApiKey = document.getElementById("freeModelApiKey")
      const freeModelPriority = document.getElementById("freeModelPriority")
      const freeModelSupportsMultimodal = document.getElementById("freeModelSupportsMultimodal")
      const freeModelEnabled = document.getElementById("freeModelEnabled")
      const freeModelStream = document.getElementById("freeModelStream")

      skuSelect.innerHTML = TIERS.map(([tier, label]) => {
        const counted = Array.from({ length: 10 }, (_, index) => {
          const calls = index + 1
          return `<option value="${tier}_${calls}">${label} ${calls} 次</option>`
        }).join("")
        return counted + `<option value="${tier}_perm">${label} 永久</option>`
      }).join("")
      upgradeSkuSelect.innerHTML = skuSelect.innerHTML

      function setMessage(target, text, ok) {
        target.textContent = text || ""
        target.classList.toggle("ok", Boolean(ok))
      }

      async function api(action, body, admin) {
        const payload = { action, ...(body || {}) }
        if (admin) payload.adminSecret = adminSecret.value.trim()
        const res = await fetch(API_BASE + "/the-wow", {
          method: "POST",
          headers: { "content-type": "text/plain;charset=UTF-8" },
          body: JSON.stringify(payload)
        })
        const text = await res.text()
        let data = {}
        try {
          data = text ? JSON.parse(text) : {}
        } catch (error) {
          data = { ok: false, message: text || "服务器返回异常" }
        }
        if (!res.ok && data.ok !== false) data.ok = false
        return data
      }

      function renderLicense(data) {
        if (!data || !data.ok) return
        activationCode.textContent = data.activationCode || ""
        licenseSummary.textContent =
          `当前版本：${data.effectiveTier}；剩余次数：${data.remainingCalls}` +
          (data.isPermanent ? `；永久等级：${data.permanentTier}` : "")
        entitlements.innerHTML = (data.entitlements || []).map(item => {
          const amount = item.isPermanent ? "永久" : `${item.remainingCalls}/${item.totalCalls} 次`
          return `<div class="entitlement">${item.tier}：${amount}；来源卡密：${item.sourceCardCode || "-"}</div>`
        }).join("")
        userResult.hidden = false
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
      }

      function formatItemTime(value) {
        if (!value) return "-"
        const number = Number(value)
        const date = new Date(number > 9999999999 ? number : number * 1000)
        if (Number.isNaN(date.getTime())) return escapeHtml(value)
        return date.toLocaleString()
      }

      function tierText(tier) {
        if (tier === "max") return "Max"
        if (tier === "ultra") return "Ultra"
        return "标准版"
      }

      function renderLedgerSection(title, rows, renderRow) {
        const content = rows && rows.length
          ? rows.map((item) => `<div class="ledger-row">${renderRow(item)}</div>`).join("")
          : `<div class="ledger-row">暂无记录</div>`
        return `<div class="ledger"><div class="ledger-title">${title}</div>${content}</div>`
      }

      function renderAdminSearch(data) {
        const summary = data.summary || {}
        const permanentText = summary.isPermanent ? `；永久等级：${tierText(summary.permanentTier)}` : ""
        adminSearchResult.innerHTML = `
          <div>用户卡密 / 激活码</div>
          <div class="activation-code">${escapeHtml(data.activationCode)}</div>
          <div class="hint">当前版本：${tierText(summary.effectiveTier)}；剩余次数：${summary.remainingCalls || 0}${permanentText}</div>
          ${renderLedgerSection("权益明细", data.entitlements || [], (item) => {
            const amount = item.isPermanent ? "永久" : `${item.remainingCalls}/${item.totalCalls} 次`
            return `${tierText(item.tier)}：${amount}；来源：${escapeHtml(item.sourceCardCode)}；更新：${formatItemTime(item.updatedAt)}`
          })}
          ${renderLedgerSection("已兑换卡密", data.cards || [], (item) => {
            return `${escapeHtml(item.cardCode)}；${tierText(item.tier)}；${item.isPermanent ? "永久" : `${item.callCount} 次`}；状态：${escapeHtml(item.status)}`
          })}
          ${renderLedgerSection("兑换/管理员加购记录", data.redemptions || [], (item) => {
            return `${escapeHtml(item.cardCode)}；SKU：${escapeHtml(item.sku)}；${item.isPermanent ? "永久" : `${item.calls} 次`}；时间：${formatItemTime(item.createdAt)}`
          })}
          ${renderLedgerSection("扣次记录", data.consumptions || [], (item) => {
            return `功能版本：${tierText(item.requiredTier)}；扣除版本：${tierText(item.chargedTier)}；数量：${item.amount}；时间：${formatItemTime(item.createdAt)}`
          })}
        `
        adminSearchResult.hidden = false
      }

      function resetFreeModelForm() {
        freeModelForm.dataset.editing = ""
        freeModelId.disabled = false
        freeModelId.value = ""
        freeModelName.value = ""
        freeModelDescription.value = ""
        freeModelProvider.value = "free"
        freeModelBaseUrl.value = ""
        freeModelApiKey.value = ""
        freeModelPriority.value = "0"
        freeModelSupportsMultimodal.value = "false"
        freeModelEnabled.value = "true"
        freeModelStream.value = "true"
      }

      function fillFreeModelForm(model) {
        freeModelForm.dataset.editing = model.id
        freeModelId.value = model.id || ""
        freeModelId.disabled = true
        freeModelName.value = model.name || ""
        freeModelDescription.value = model.description || ""
        freeModelProvider.value = model.provider || "free"
        freeModelBaseUrl.value = model.baseUrl || ""
        freeModelApiKey.value = ""
        freeModelPriority.value = String(model.priority ?? 0)
        freeModelSupportsMultimodal.value = model.supportsMultimodal ? "true" : "false"
        freeModelEnabled.value = model.enabled ? "true" : "false"
        freeModelStream.value = model.stream === false ? "false" : "true"
      }

      function renderFreeModels(models, adminView) {
        if (!models || !models.length) {
          freeModelList.innerHTML = '<div class="item-meta">当前没有免费模型，客户端会显示空态。</div>'
          return
        }
        freeModelList.innerHTML = models.map((model) => `
          <div class="list-item">
            <div class="list-item-head">
              <div>
                <strong>${escapeHtml(model.name)}</strong>
                <div class="item-meta">${escapeHtml(model.id)} · ${escapeHtml(model.description || "-")}</div>
              </div>
              <span class="badge ${model.enabled ? "" : "off"}">${model.enabled ? "启用" : "停用"}</span>
            </div>
            <div class="item-meta">
              Provider: ${escapeHtml(model.provider || "-")} ·
              多模态: ${model.supportsMultimodal ? "是" : "否"} ·
              流式: ${model.stream ? "是" : "否"} ·
              优先级: ${escapeHtml(model.priority)}
              ${model.hasApiKey ? " · Key 已配置" : " · 未配置 Key"}
            </div>
            ${adminView ? `
              <div class="mini-actions">
                <button type="button" data-edit="${escapeHtml(model.id)}" class="secondary">编辑</button>
                <button type="button" data-toggle="${escapeHtml(model.id)}" class="secondary">${model.enabled ? "停用" : "启用"}</button>
                <button type="button" data-delete="${escapeHtml(model.id)}" class="secondary">删除</button>
              </div>
            ` : ''}
          </div>
        `).join("")
      }

      async function loadFreeModels() {
        const adminView = Boolean(adminSecret.value.trim())
        const data = await api("list-free-models", adminView ? { adminView: true } : {}, adminView)
        if (!data.ok) {
          setMessage(freeModelMessage, data.message || "加载免费模型失败")
          freeModelList.innerHTML = ""
          return
        }
        renderFreeModels(data.models || [], adminView)
        setMessage(
          freeModelMessage,
          adminView ? `已加载 ${data.models.length} 个免费模型（管理员视图）` : `已加载 ${data.models.length} 个免费模型`,
          true
        )
      }

      document.getElementById("redeemBtn").addEventListener("click", async () => {
        setMessage(userMessage, "")
        userResult.hidden = true
        const cardCode = document.getElementById("cardCode").value.trim()
        if (!cardCode) {
          setMessage(userMessage, "请输入卡密")
          return
        }
        const data = await api("redeem", { cardCode })
        if (!data.ok) {
          setMessage(userMessage, data.message || "激活失败")
          return
        }
        renderLicense(data)
        setMessage(userMessage, data.message || "激活成功", true)
      })

      document.getElementById("statusBtn").addEventListener("click", async () => {
        setMessage(userMessage, "")
        userResult.hidden = true
        const cardCode = document.getElementById("cardCode").value.trim()
        if (!cardCode) {
          setMessage(userMessage, "请输入卡密")
          return
        }
        const data = await api("status", { cardCode })
        if (!data.ok) {
          setMessage(userMessage, data.message || "查询失败")
          return
        }
        renderLicense(data)
        setMessage(userMessage, "查询成功", true)
      })

      document.getElementById("generateBtn").addEventListener("click", async () => {
        const secret = adminSecret.value.trim()
        if (!secret) {
          setMessage(adminMessage, "请输入管理员密码")
          return
        }
        const data = await api("generate-cards", {
          sku: skuSelect.value,
          count: document.getElementById("cardCount").value,
          prefix: document.getElementById("cardPrefix").value
        }, true)
        if (!data.ok) {
          setMessage(adminMessage, data.message || "生成失败")
          return
        }
        generatedOutput.value = data.text || (data.cards || []).join("\n")
        setMessage(adminMessage, `已生成 ${(data.cards || []).length} 个卡密`, true)
      })

      document.getElementById("copyBtn").addEventListener("click", async () => {
        if (!generatedOutput.value) {
          setMessage(adminMessage, "没有可复制的卡密")
          return
        }
        try {
          await navigator.clipboard.writeText(generatedOutput.value)
          setMessage(adminMessage, "已复制", true)
        } catch (error) {
          generatedOutput.select()
          setMessage(adminMessage, "请手动复制文本框内容")
        }
      })

      document.getElementById("adminSearchBtn").addEventListener("click", async () => {
        const secret = adminSecret.value.trim()
        const keyword = document.getElementById("adminSearchCode").value.trim()
        setMessage(adminSearchMessage, "")
        adminSearchResult.hidden = true
        if (!secret) {
          setMessage(adminSearchMessage, "请输入管理员密码")
          return
        }
        if (!keyword) {
          setMessage(adminSearchMessage, "请输入用户原卡密或激活码")
          return
        }
        const data = await api("search-license", { keyword }, true)
        if (!data.ok) {
          setMessage(adminSearchMessage, data.message || "查询失败")
          return
        }
        renderAdminSearch(data)
        document.getElementById("upgradeCardCode").value = data.activationCode || keyword
        document.getElementById("cardCode").value = data.activationCode || keyword
        setMessage(adminSearchMessage, "查询成功，已填入升级卡密", true)
      })

      document.getElementById("upgradeBtn").addEventListener("click", async () => {
        const secret = adminSecret.value.trim()
        const cardCode = document.getElementById("upgradeCardCode").value.trim()
        if (!secret) {
          setMessage(upgradeMessage, "请输入管理员密码")
          return
        }
        if (!cardCode) {
          setMessage(upgradeMessage, "请输入用户原卡密")
          return
        }
        const data = await api("grant-entitlement", {
          cardCode,
          sku: upgradeSkuSelect.value
        }, true)
        if (!data.ok) {
          setMessage(upgradeMessage, data.message || "升级失败")
          return
        }
        renderLicense(data)
        document.getElementById("cardCode").value = data.activationCode || cardCode
        document.getElementById("adminSearchCode").value = data.activationCode || cardCode
        setMessage(upgradeMessage, data.message || "升级成功，用户重启 APP 后生效", true)
      })

      document.getElementById("freeModelSaveBtn").addEventListener("click", async (event) => {
        event.preventDefault()
        const secret = adminSecret.value.trim()
        if (!secret) {
          setMessage(freeModelMessage, "请输入管理员密码")
          return
        }
        const data = await api("upsert-free-model", {
          modelId: freeModelId.value.trim(),
          name: freeModelName.value.trim(),
          description: freeModelDescription.value.trim(),
          provider: freeModelProvider.value.trim(),
          baseUrl: freeModelBaseUrl.value.trim(),
          apiKey: freeModelApiKey.value.trim(),
          priority: freeModelPriority.value,
          supportsMultimodal: freeModelSupportsMultimodal.value === "true",
          enabled: freeModelEnabled.value === "true",
          stream: freeModelStream.value === "true"
        }, true)
        if (!data.ok) {
          setMessage(freeModelMessage, data.message || "保存失败")
          return
        }
        fillFreeModelForm(data.model)
        await loadFreeModels()
        setMessage(freeModelMessage, "保存成功", true)
      })

      document.getElementById("freeModelClearBtn").addEventListener("click", () => {
        resetFreeModelForm()
        setMessage(freeModelMessage, "")
      })

      document.getElementById("freeModelReloadBtn").addEventListener("click", loadFreeModels)

      freeModelList.addEventListener("click", async (event) => {
        if (!adminSecret.value.trim()) return
        const editId = event.target && event.target.dataset ? event.target.dataset.edit : ""
        const toggleId = event.target && event.target.dataset ? event.target.dataset.toggle : ""
        const deleteId = event.target && event.target.dataset ? event.target.dataset.delete : ""
        if (editId) {
          const data = await api("list-free-models", { adminView: true }, true)
          const model = (data.models || []).find((item) => item.id === editId)
          if (model) fillFreeModelForm(model)
          return
        }
        if (toggleId) {
          const current = (await api("list-free-models", { adminView: true }, true)).models || []
          const model = current.find((item) => item.id === toggleId)
          if (!model) return
          const result = await api("set-free-model-enabled", {
            modelId: toggleId,
            enabled: !model.enabled
          }, true)
          if (!result.ok) {
            setMessage(freeModelMessage, result.message || "切换失败")
            return
          }
          await loadFreeModels()
          setMessage(freeModelMessage, "状态已更新", true)
          return
        }
        if (deleteId) {
          const result = await api("delete-free-model", { modelId: deleteId }, true)
          if (!result.ok) {
            setMessage(freeModelMessage, result.message || "删除失败")
            return
          }
          resetFreeModelForm()
          await loadFreeModels()
          setMessage(freeModelMessage, "已删除", true)
        }
      })

      resetFreeModelForm()
      loadFreeModels()
    </script>
  </body>
</html>
